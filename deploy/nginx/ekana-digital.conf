####################################################################
# ekana-digital - static SPA (React 19 + Vite 8 + react-router-dom)
#
# Build:    npm run build
# Deploy:   rsync -a --delete dist/ user@server:/var/www/html/ekana-digital/
#
# WARNING: the docroot must contain ONLY the contents of dist/.
# Copying the repository into the docroot serves raw source instead:
#   /index.html     -> references /src/main.jsx, not /assets/index-<hash>.js
#   /src/main.jsx   -> application/octet-stream, module load fails
#   /package.json, /src/App.jsx, /vite.config.js -> publicly downloadable
# Console symptoms: "Failed to load module script: ... MIME type
# application/octet-stream" plus a 404 for /favicon.svg.
####################################################################

    # ---------- HTTP: ACME challenge + redirect to HTTPS ----------
    server {
        listen      80;
        listen      [::]:80;
        server_name ekanafilms.com www.ekanafilms.com;

        # Must stay reachable over plain HTTP or certbot renewal fails.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS: the site ----------
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;   # nginx >= 1.25.1; on older versions use
                        # "listen 443 ssl http2;" instead
        server_name ekanafilms.com www.ekanafilms.com;

        root  /var/www/html/ekana-digital;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/ekanafilms.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ekanafilms.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        charset      utf-8;
        server_tokens off;

        # ---------- Compression ----------
        gzip            on;
        gzip_vary       on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_proxied    any;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/manifest+json
            application/xml
            application/rss+xml
            image/svg+xml
            font/woff
            font/woff2;

        # ---------- SPA routing ----------
        # The router uses real paths (/about, /team, /portfolio, /services,
        # /contact). Without this fallback, a hard refresh or a shared link
        # on a deep route returns 404 instead of the app. The app's own
        # catch-all route renders the Error page, so this always returns 200
        # for real routes and a real 404 for missing files.
        location / {
            try_files $uri $uri/ /index.html;
            include    /etc/nginx/snippets/ekana-security-headers.conf;
        }

        # Hashed build output (/assets/index-XXXX.js) -> cache forever.
        # A miss is a broken deploy, so 404 rather than the HTML shell.
        location /assets/ {
            access_log off;
            add_header  Cache-Control "public, max-age=31536000, immutable" always;
            try_files  $uri =404;
            include    /etc/nginx/snippets/ekana-security-headers.conf;
        }

        # Entry point: must revalidate so new deploys are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include    /etc/nginx/snippets/ekana-security-headers.conf;
        }

        # Files copied verbatim from public/ (favicon.svg, icons.svg, ...).
        # These are not hashed, so they get a short cache.
        location ~* ^/(?:favicon\.svg|icons\.svg|robots\.txt|sitemap\.xml|manifest\.webmanifest)$ {
            expires    7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files  $uri =404;
            include    /etc/nginx/snippets/ekana-security-headers.conf;
        }

        # Block dotfiles (.git, .env, .htaccess). ACME is handled by the ^~
        # prefix on port 80 and is never exposed over HTTPS.
        location ~ /\. {
            deny all;
            access_log off;
            include /etc/nginx/snippets/ekana-security-headers.conf;
        }
    }
